print_table_en: true
basic_server_bridge:
  server_ip: 10.21.31.103
  udp_port: 30000
  tcp_port: 30001
  local_udp_port: 0
  transport: tcp
  heartbeat_hz: 1.0
  # Keep command and status topics separate: subscribing to a status topic would
  # otherwise send the bridge's own status messages back to the robot.
  motion_state_control_topic: /m20/control/motion_state
  # Standard navigation output. Each received Twist is forwarded once to M20.
  cmd_vel_topic: /cmd_vel_smoothed
  mode_control_topic: /m20/control/usage_mode
  motion_state_status_topic: /m20/state/motion_state
  gait_status_topic: /m20/state/gait
  motion_info_status_topic: /m20/state/motion_info
  odometry_topic: /m20/state/odometry
  odom_frame_id: odom
  base_frame_id: base_link
  # Skip pose integration after a long report gap to avoid a false pose jump.
  odom_max_integration_dt_sec: 0.2
  control_result_topic: /m20/state/control_result
  # Velocity normalization is selected automatically from the active gait:
  # 0x1001/0x1003/0x3003: X=2.0 m/s, Y=1.0 m/s, Yaw=2.0 rad/s;
  # 0x3002: X=2.0 m/s, Y=1.0 m/s, Yaw=1.5 rad/s.
  axis_command_timeout_ms: 300
  # Hard physical caps. The Route3D adapter normally applies the stricter
  # phase-specific limits first; these values protect direct bridge use.
  maximum_vx_mps: 0.8
  maximum_vy_mps: 0.3
  maximum_wz_radps: 0.5
  # If no APDU is received for this interval, send a zero-speed stop and reconnect.
  network_disconnect_timeout_ms: 3000
