route3d_route_slicer:
  ros__parameters:
    strict_schema_v2: true

    waypoint:
      # Corners are hard via-points, not semantic task boundaries by default.
      corner_pass_radius_m: 0.20
      normal_pass_radius_m: 0.45

    slicing:
      # End the current task at every mandatory corner. This preserves the
      # corner pass radius for controllers that only consume nav_msgs/Path.
      split_at_corners: true
      attribute_epsilon: 1.0e-6

    controller:
      # M20 selection is driven only by edge attributes. obstacleMode=1 forces
      # Efficient, mode 2 forces PID, and mode 4 requests external handover.
      auto_default: pid
      auto_grid: external_grid

    topics:
      dijkstra_status: /route3d_dijkstra/status
      tasks: /route3d_route_slicer/tasks
      tasks_json: /route3d_route_slicer/tasks_json
      status: /route3d_route_slicer/status
      markers: /route3d_route_slicer/markers
